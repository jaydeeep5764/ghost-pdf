<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostPDF Studio - Global Search, Replace & Anti-Overlap Editor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .page-container {
            position: relative;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.4), 0 10px 15px -5px rgba(0, 0, 0, 0.2);
            user-select: none;
            transition: transform 0.15s ease-out;
        }

        /* Overlay hitboxes for selectable text */
        .text-target-box {
            position: absolute;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.1s ease;
        }
        .text-overlay-box:hover {
            background-color: rgba(59, 130, 246, 0.16);
            outline: 2px dashed #2563EB;
            outline-offset: 1px;
        }
        .active-inline-box {
            position: absolute;
            border: 2px solid #2563EB;
            background: rgba(255, 255, 255, 0.98);
            outline: none;
            padding: 4px 6px;
            border-radius: 4px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            z-index: 50;
            resize: both;
            overflow: auto;
            line-height: 1.35;
        }
        .search-match-highlight.active-match {
            background-color: rgba(239, 68, 68, 0.55);
            border-color: #EF4444;
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.9);
            z-index: 26;
            animation: pulseActiveMatch 1.2s infinite ease-in-out;
        }
        @keyframes pulseActiveMatch {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* Image hitboxes */
        .image-target-box {
            position: absolute;
            cursor: pointer;
            border: 2px dashed rgba(168, 85, 247, 0.7);
            background: rgba(168, 85, 247, 0.12);
            border-radius: 6px;
            transition: all 0.15s ease;
            z-index: 15;
        }
        .image-target-box:hover {
            border-color: #C084FC;
            background: rgba(168, 85, 247, 0.28);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.45);
        }
        .image-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            background: #1E1B4B;
            color: #E9D5FF;
            border: 1px solid #7E22CE;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        /* Active Draggable Card */
        .draggable-editor-card {
            position: absolute;
            background: #0F172A;
            color: #F8FAFC;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(59, 130, 246, 0.4);
            z-index: 100;
            display: flex;
            flex-direction: column;
            width: 340px;
            min-width: 280px;
            user-select: none;
            overflow: hidden;
            animation: popIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .drag-header {
            cursor: grab;
            background: #1E293B;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }
        .drag-header:active {
            cursor: grabbing;
        }

        /* Ghost box during drag */
        .ghost-placement-box {
            position: absolute;
            border: 2px dashed #3B82F6;
            background: rgba(59, 130, 246, 0.15);
            border-radius: 4px;
            pointer-events: none;
            z-index: 90;
            transition: left 0.05s ease, top 0.05s ease;
        }

        /* Marquee selection rect */
        .marquee-rect {
            position: absolute;
            border: 2px dashed #EF4444;
            background: rgba(239, 68, 68, 0.15);
            pointer-events: none;
            z-index: 80;
        }

        .tool-btn.active {
            background-color: #3B82F6;
            color: #FFFFFF;
        }

        .granularity-btn.active {
            background-color: #2563EB;
            color: #FFFFFF;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans overflow-hidden select-none">

    <!-- Top Navigation Header -->
    <header class="bg-slate-950 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shadow-md z-30 flex-wrap gap-2">
        <!-- Left: Brand & File Actions -->
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <div class="bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 text-white p-2 rounded-lg font-bold flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i data-lucide="ghost" class="w-5 h-5"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-bold text-base tracking-tight text-white">GhostPDF Studio</h1>
                        <span class="text-[10px] font-bold px-1.5 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded flex items-center gap-1">
                            <i data-lucide="shield-check" class="w-3 h-3"></i> Anti-Overlap Reflow
                        </span>
                    </div>
                    <p class="text-[11px] text-slate-400 leading-none">Global Search, Replace & Stream Layout Engine</p>
                </div>
            </div>

            <div class="h-6 w-px bg-slate-800 mx-1"></div>

            <!-- Upload PDF -->
            <label class="cursor-pointer flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white rounded-lg text-xs font-medium transition border border-slate-700" title="Upload any PDF to edit locally">
                <i data-lucide="upload" class="w-3.5 h-3.5 text-blue-400"></i>
                <span>Open PDF</span>
                <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden">
            </label>
        </div>

        <!-- Center: Tool Modes & Granularity -->
        <div class="flex items-center gap-2 bg-slate-900 p-1 rounded-xl border border-slate-800 shadow-inner">
            <!-- Main Tools -->
            <div class="flex items-center gap-1">
                <button id="toolSelectBtn" class="tool-btn active flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition" title="Select & Edit Text / Image">
                    <i data-lucide="mouse-pointer" class="w-3.5 h-3.5"></i>
                    <span>Select</span>
                </button>
                <button id="toolAddTextBtn" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition" title="Add movable text box">
                    <i data-lucide="plus-circle" class="w-3.5 h-3.5 text-emerald-400"></i>
                    <span>Add Text</span>
                </button>
                <button id="toolEraseAreaBtn" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition" title="Draw rectangle to whiteout / erase area">
                    <i data-lucide="square-dashed" class="w-3.5 h-3.5 text-rose-400"></i>
                    <span>Erase Area</span>
                </button>
                <button id="toolPanBtn" class="tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition" title="Hand Tool (Pan canvas, or hold Space)">
                    <i data-lucide="hand" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <div class="h-4 w-px bg-slate-800 mx-1"></div>

            <!-- Granularity Selector -->
            <div class="flex items-center bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[11px]" id="granularityContainer">
                <span class="text-slate-400 px-2 font-medium">Select:</span>
                <button id="granWordBtn" class="granularity-btn active px-2.5 py-1 rounded text-slate-300 hover:text-white transition flex items-center gap-1" title="Click to select individual word">
                    <span>🔤 Word</span>
                </button>
                <button id="granLineBtn" class="granularity-btn px-2.5 py-1 rounded text-slate-300 hover:text-white transition flex items-center gap-1" title="Click to select whole line">
                    <span>📝 Line</span>
                </button>
                <button id="granBlockBtn" class="granularity-btn px-2.5 py-1 rounded text-slate-300 hover:text-white transition flex items-center gap-1" title="Click to select whole text box / block">
                    <span>📦 Text Box</span>
                </button>
            </div>
        </div>

        <!-- Right: Find & Replace, Undo/Redo, Pagination, Zoom, Export -->
        <div class="flex items-center gap-2">
            <!-- Global Find & Replace Toggle Button -->
            <button id="findReplaceToggleBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-amber-300 hover:text-white bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 transition shadow-sm" title="Global Search & Replace across whole PDF (Ctrl+F / Cmd+F)">
                <i data-lucide="search" class="w-3.5 h-3.5 text-amber-400"></i>
                <span>Find & Replace</span>
            </button>

            <!-- Undo / Redo -->
            <div class="flex items-center bg-slate-900 rounded-lg border border-slate-800 p-0.5">
                <button id="undoBtn" disabled class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-white disabled:opacity-30 disabled:pointer-events-none transition" title="Undo (Ctrl+Z / Cmd+Z)">
                    <i data-lucide="undo-2" class="w-4 h-4"></i>
                </button>
                <button id="redoBtn" disabled class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-white disabled:opacity-30 disabled:pointer-events-none transition" title="Redo (Ctrl+Y / Cmd+Shift+Z)">
                    <i data-lucide="redo-2" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Pagination -->
            <div class="flex items-center bg-slate-900 px-2 py-1 rounded-lg border border-slate-800 text-xs">
                <button id="prevPageBtn" class="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white disabled:opacity-30">
                    <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
                </button>
                <span id="pageIndicator" class="font-medium text-slate-300 px-2">Page 1 of 1</span>
                <button id="nextPageBtn" class="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white disabled:opacity-30">
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <!-- Zoom Controls -->
            <div class="flex items-center bg-slate-900 px-2 py-1 rounded-lg border border-slate-800 text-xs">
                <button id="zoomOutBtn" class="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white" title="Zoom Out">
                    <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                </button>
                <button id="zoomResetBtn" class="w-12 text-center font-mono font-medium text-slate-200 hover:text-blue-400 transition" title="Click to reset to 100%">
                    <span id="zoomLabel">100%</span>
                </button>
                <button id="zoomInBtn" class="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white" title="Zoom In">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                </button>
                <button id="fitWidthBtn" class="p-1 ml-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white" title="Fit to Width">
                    <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <!-- Download Clean PDF -->
            <button id="downloadPdfBtn" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold shadow-md shadow-emerald-600/20 transition flex items-center gap-1.5">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Download Clean PDF</span>
            </button>
        </div>
    </header>

    <!-- Sub-bar: Instructions & Live Status -->
    <div class="bg-slate-950/70 border-b border-slate-800/80 px-6 py-1.5 text-xs text-slate-300 flex items-center justify-between backdrop-blur-sm">
        <div class="flex items-center gap-2">
            <i data-lucide="info" class="w-4 h-4 text-blue-600"></i>
            <span><strong>Click on any text</strong> to open the multi-line editing box. Edit lines or full paragraphs. Press <strong>Ctrl+Enter</strong> or click <strong>Apply</strong>!</span>
        </div>
        <div id="liveStatusMsg" class="font-medium text-emerald-400 flex items-center gap-1.5 text-[11px]">
            <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
            <span>Ready</span>
        </div>
    </div>

    <!-- Main Workspace Viewport -->
    <main id="viewportContainer" class="flex-1 overflow-auto p-8 flex justify-center items-start bg-slate-950 cursor-default relative">
        <div id="pageWrapper" class="page-container relative bg-white transition-transform origin-top rounded shadow-2xl">
            <!-- Background Rendered Page Image -->
            <img id="pdfPageImage" src="" alt="PDF Page" class="block w-full h-auto select-none pointer-events-none" draggable="false">

            <!-- Interactive Click-to-Edit Layer -->
            <div id="interactiveOverlay" class="absolute inset-0"></div>

            <!-- Search Matches Highlight Layer -->
            <div id="searchHighlightsLayer" class="absolute inset-0 pointer-events-none"></div>

            <!-- Ghost Preview Box while Dragging -->
            <div id="ghostPlacementBox" class="ghost-placement-box hidden"></div>

            <!-- Selection Marquee Rect -->
            <div id="selectionMarquee" class="marquee-rect hidden"></div>
        </div>
    </main>

    <!-- Global Find & Replace Floating Card / Modal -->
    <div id="findReplaceModal" class="hidden absolute top-14 right-6 bg-slate-900 border border-slate-700 text-slate-100 p-4 rounded-xl shadow-2xl z-[130] w-[380px] flex flex-col gap-3">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <div class="flex items-center gap-2">
                <i data-lucide="search" class="w-4 h-4 text-amber-400"></i>
                <span class="text-xs font-semibold text-slate-200">Global Find & Replace</span>
                <span id="findMatchesCountBadge" class="text-[10px] font-mono bg-slate-800 text-amber-300 px-1.5 py-0.5 rounded border border-slate-700">0 matches</span>
            </div>
            <button id="findCloseBtn" class="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white" title="Close (Esc)">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
        </div>

        <!-- Find Input -->
        <div class="flex flex-col gap-1">
            <label class="text-[10px] font-medium text-slate-400">Find in Document:</label>
            <div class="flex items-center gap-1 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1">
                <input type="text" id="findSearchInput" placeholder="Type search word or phrase..." class="flex-1 bg-transparent text-xs text-slate-100 focus:outline-none font-sans">
                <button id="findPrevBtn" class="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white" title="Previous occurrence">
                    <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
                </button>
                <button id="findNextBtn" class="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-white" title="Next occurrence">
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>

        <button id="boldToggleBtn" class="px-2.5 py-0.5 rounded font-bold text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition" title="Toggle Bold">B</button>
        <button id="italicToggleBtn" class="px-2.5 py-0.5 rounded italic font-serif text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition" title="Toggle Italic">I</button>

        <div class="h-4 w-px bg-slate-700 mx-1"></div>

        <button id="expandParagraphBtn" class="px-2.5 py-0.5 rounded text-xs bg-slate-800 text-blue-300 hover:bg-slate-700 transition hidden items-center gap-1 font-medium" title="Expand selection to edit entire paragraph">
            <i data-lucide="align-left" class="w-3.5 h-3.5"></i>
            <span>Edit Paragraph</span>
        </button>

        <div class="h-4 w-px bg-slate-700 mx-1"></div>

        <input type="color" id="colorPicker" value="#000000" class="w-6 h-6 bg-transparent cursor-pointer rounded border-0">

        <!-- Scope & Reflow Options -->
        <div class="flex items-center justify-between text-[11px] text-slate-300 px-1">
            <label class="flex items-center gap-1.5 cursor-pointer">
                <input type="checkbox" id="findScopeAllPages" checked class="rounded border-slate-700 text-blue-600 focus:ring-0">
                <span>Whole PDF (All Pages)</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
                <input type="checkbox" id="findReflowToggle" checked class="rounded border-slate-700 text-blue-600 focus:ring-0">
                <span class="text-blue-400 font-medium">🛡️ Anti-Overlap</span>
            </label>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-800">
            <button id="findReplaceCurrentBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white rounded-lg text-xs font-medium transition flex items-center gap-1">
                <span>Replace Next</span>
            </button>
            <button id="findReplaceAllBtn" class="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-semibold shadow-md shadow-amber-600/30 transition flex items-center gap-1.5">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                <span>Replace All Everywhere</span>
            </button>
        </div>
    </div>

        <button id="saveEditBtn" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 rounded text-xs font-semibold flex items-center gap-1.5 transition">
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
            <span>Apply</span>
            <kbd class="text-[9px] text-emerald-100 bg-emerald-800/80 px-1 py-0.5 rounded uppercase font-mono font-normal">Enter ↵</kbd>
        </button>
    </div>

    <script>
        // State variables
        let currentPageIndex = 0;
        let totalPages = 1;
        let originalPageWidth = 595;
        let originalPageHeight = 842;
        let zoomLevel = 1.0;
        let pageSpans = [];
        let pageBlocks = [];

        // Structured text & image data from PyMuPDF
        let pageWords = [];
        let pageLines = [];
        let pageBlocks = [];
        let pageImages = [];

        // Global Find & Replace state
        let searchResults = [];
        let flatMatches = [];
        let currentMatchIndex = -1;
        let searchDebounceTimer = null;

        // Tools: 'select', 'addText', 'eraseArea', 'pan'
        let activeTool = 'select';
        // Granularity: 'word', 'line', 'block'
        let activeGranularity = 'word';

        // Text editor state
        let activeEditorTarget = null;
        let isDraggingEditor = false;
        let dragStartMouseX = 0, dragStartMouseY = 0;
        let dragStartCardX = 0, dragStartCardY = 0;

        // Image inspector state
        let activeImageTarget = null;
        let isDraggingImageCard = false;
        let dragStartImgCardX = 0, dragStartImgCardY = 0;
        let newImageBase64 = null;
        let newImageNaturalRatio = 1.0;

        // Area selection state
        let isMarqueeActive = false;
        let marqueeStartX = 0, marqueeStartY = 0;
        let marqueeRect = null;

        // Pan tool state
        let isPanning = false;
        let panStartX = 0, panStartY = 0;
        let panScrollLeft = 0, panScrollTop = 0;
        let spacePressed = false;

        // DOM Elements
        const viewportContainer = document.getElementById('viewportContainer');
        const pageWrapper = document.getElementById('pageWrapper');
        const pdfPageImage = document.getElementById('pdfPageImage');
        const interactiveOverlay = document.getElementById('interactiveOverlay');
        const searchHighlightsLayer = document.getElementById('searchHighlightsLayer');
        const ghostPlacementBox = document.getElementById('ghostPlacementBox');
        const selectionMarquee = document.getElementById('selectionMarquee');

        // Navigation & Tools
        const toolSelectBtn = document.getElementById('toolSelectBtn');
        const toolAddTextBtn = document.getElementById('toolAddTextBtn');
        const toolEraseAreaBtn = document.getElementById('toolEraseAreaBtn');
        const toolPanBtn = document.getElementById('toolPanBtn');

        const granWordBtn = document.getElementById('granWordBtn');
        const granLineBtn = document.getElementById('granLineBtn');
        const granBlockBtn = document.getElementById('granBlockBtn');

        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const pageIndicator = document.getElementById('pageIndicator');

        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomResetBtn = document.getElementById('zoomResetBtn');
        const fitWidthBtn = document.getElementById('fitWidthBtn');
        const zoomLabel = document.getElementById('zoomLabel');

        const pdfFileInput = document.getElementById('pdfFileInput');
        const downloadPdfBtn = document.getElementById('downloadPdfBtn');
        const liveStatusMsg = document.getElementById('liveStatusMsg');
        const modeDescription = document.getElementById('modeDescription');

        const fontSizeDisplay = document.getElementById('fontSizeDisplay');
        const sizeMinusBtn = document.getElementById('sizeMinusBtn');
        const sizePlusBtn = document.getElementById('sizePlusBtn');
        const boldToggleBtn = document.getElementById('boldToggleBtn');
        const italicToggleBtn = document.getElementById('italicToggleBtn');
        const expandParagraphBtn = document.getElementById('expandParagraphBtn');
        const colorPicker = document.getElementById('colorPicker');
        const deleteTextBtn = document.getElementById('deleteTextBtn');
        const saveEditBtn = document.getElementById('saveEditBtn');

        lucide.createIcons();

        // -------------------------------------------------------------
        // Data Loading & Rendering
        // -------------------------------------------------------------
        async function loadPage(pageIdx = 0) {
            setStatus('Loading page data...', 'loading');
            try {
                const res = await fetch(`/api/page?num=${pageIdx}`);
                const data = await res.json();
                renderPageData(data);
                setStatus('Ready', 'success');
            } catch (err) {
                const res = await fetch('/api/sample');
                const data = await res.json();
                renderPageData(data);
                setStatus('Ready', 'success');
            }
        }

        function renderPageData(data) {
            currentPageIndex = data.page_index;
            totalPages = data.total_pages;
            originalPageWidth = data.width;
            originalPageHeight = data.height;
            pageSpans = data.spans;
            pageBlocks = data.blocks || [];

            pageIndicator.innerText = `Page ${currentPageIndex + 1} of ${totalPages}`;
            prevPageBtn.disabled = (currentPageIndex <= 0);
            nextPageBtn.disabled = (currentPageIndex >= totalPages - 1);

            undoBtn.disabled = !data.can_undo;
            redoBtn.disabled = !data.can_redo;

            pdfPageImage.src = data.image;
            pdfPageImage.onload = () => {
                rebuildInteractiveOverlay();
                renderSearchHighlights();
            };
        }

        function rebuildInteractiveOverlay() {
            interactiveOverlay.innerHTML = '';
            closeEditorCard();
            closeImageCard();
            closeAreaModal();

            if (activeTool === 'pan' || activeTool === 'eraseArea') {
                return;
            }

            const renderWidth = pdfPageImage.clientWidth;
            const renderHeight = pdfPageImage.clientHeight;
            if (!renderWidth || !renderHeight) return;

            const scaleX = renderWidth / originalPageWidth;
            const scaleY = renderHeight / originalPageHeight;

            // Render block-level interactive boxes so users can select and edit whole multi-line blocks/paragraphs at once
            const itemsToRender = (pageBlocks && pageBlocks.length > 0) ? pageBlocks : pageSpans;

            itemsToRender.forEach(item => {
                const [x0, y0, x1, y1] = item.bbox;
                const left = x0 * scaleX;
                const top = y0 * scaleY;
                const width = Math.max((x1 - x0) * scaleX, 16);
                const height = Math.max((y1 - y0) * scaleY, 14);

                const box = document.createElement('div');
                box.className = `text-target-box ${targetClass}`;
                box.style.left = `${left}px`;
                box.style.top = `${top}px`;
                box.style.width = `${width}px`;
                box.style.height = `${height}px`;

                const previewText = item.text.replace(/\s+/g, ' ').trim().substring(0, 40);
                box.title = `Click to edit: "${previewText}..." (${item.line_count || 1} lines)`;

                box.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openBlockEditor(item, box);
                });

                interactiveOverlay.appendChild(box);
            });

            lucide.createIcons();
        }

        function findContainingLine(bbox) {
            const [x0, y0, x1, y1] = bbox;
            const cy = (y0 + y1) / 2;
            for (const line of pageLines) {
                if (cy >= line.bbox[1] - 3 && cy <= line.bbox[3] + 3) {
                    return line;
                }
            }
            return null;
        }

        async function triggerSearch() {
            const query = findSearchInput.value.trim();
            if (!query) {
                searchResults = [];
                flatMatches = [];
                currentMatchIndex = -1;
                findMatchesCountBadge.innerText = '0 matches';
                clearSearchHighlights();
                return;
            }

            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                searchResults = data.results || [];
                
                flatMatches = [];
                searchResults.forEach(r => {
                    r.matches.forEach(m => flatMatches.push(m));
                });

                if (flatMatches.length > 0) {
                    currentMatchIndex = 0;
                    findMatchesCountBadge.innerText = `${currentMatchIndex + 1} of ${flatMatches.length} matches`;
                    
                    // If first match is on a different page, load it
                    if (flatMatches[0].page_index !== currentPageIndex) {
                        await loadPage(flatMatches[0].page_index);
                    } else {
                        renderSearchHighlights();
                    }
                } else {
                    currentMatchIndex = -1;
                    findMatchesCountBadge.innerText = '0 matches';
                    clearSearchHighlights();
                }
            } catch (err) {
                console.error('Search error:', err);
            }
        }

        function renderSearchHighlights() {
            searchHighlightsLayer.innerHTML = '';
            if (flatMatches.length === 0) return;

            const scaleX = pdfPageImage.clientWidth / originalPageWidth;
            const scaleY = pdfPageImage.clientHeight / originalPageHeight;

            flatMatches.forEach((m, idx) => {
                if (m.page_index === currentPageIndex) {
                    const [x0, y0, x1, y1] = m.bbox;
                    const left = x0 * scaleX;
                    const top = y0 * scaleY;
                    const width = (x1 - x0) * scaleX;
                    const height = (y1 - y0) * scaleY;

                    const mark = document.createElement('div');
                    mark.className = `search-match-highlight ${idx === currentMatchIndex ? 'active-match' : ''}`;
                    mark.style.left = `${left}px`;
                    mark.style.top = `${top}px`;
                    mark.style.width = `${width}px`;
                    mark.style.height = `${height}px`;

                    searchHighlightsLayer.appendChild(mark);

        function openBlockEditor(item, boxElement) {
            closeActiveInput();

            const isBoldInitial = Boolean(item.is_bold) || Boolean(item.flags & 16) || /-bold|_bold|\bbold\b|\bheavy\b|\bblack\b/i.test(item.font);
            const isItalicInitial = Boolean(item.is_italic) || Boolean(item.flags & 2) || /-italic|_italic|\bitalic\b|\boblique\b/i.test(item.font);

            activeEditTarget = {
                isNew: false,
                block: item,
                bbox: item.bbox,
                origin: item.origin || null,
                text: item.text,
                size: item.size,
                color: item.color,
                font: item.font,
                flags: item.flags || 0,
                is_bold: isBoldInitial,
                is_italic: isItalicInitial,
                is_paragraph: Boolean(item.line_count > 1 || item.text.includes('\n')),
                customSize: false
            };

            const textarea = document.createElement('textarea');
            textarea.className = 'active-inline-box';
            textarea.value = item.text;

            const scaleX = pdfPageImage.clientWidth / originalPageWidth;
            const scaleY = pdfPageImage.clientHeight / originalPageHeight;
            const [bx0, by0, bx1, by1] = item.bbox;

            const screenLeft = bx0 * scaleX;
            const screenTop = by0 * scaleY;
            const screenWidth = Math.max((bx1 - bx0) * scaleX + 16, 260);
            const screenHeight = Math.max((by1 - by0) * scaleY + 16, 44);

            textarea.style.left = `${screenLeft}px`;
            textarea.style.top = `${screenTop}px`;
            textarea.style.width = `${screenWidth}px`;
            textarea.style.height = `${screenHeight}px`;
            textarea.style.fontSize = `${activeEditTarget.size * scaleY}px`;
            textarea.style.color = activeEditTarget.color;
            textarea.style.lineHeight = '1.35';

            const isMono = Boolean(item.flags & 8) || /mono|courier|consolas/i.test(item.font);
            const isSerif = Boolean(item.flags & 4) || /times|roman|serif|termes|georgia|cmr|lmroman/i.test(item.font);

            textarea.style.fontWeight = activeEditTarget.is_bold ? '700' : '400';
            textarea.style.fontStyle = activeEditTarget.is_italic ? 'italic' : 'normal';
            if (isMono) {
                textarea.style.fontFamily = '"DejaVu Sans Mono", Consolas, "Courier New", monospace';
            } else if (isSerif) {
                textarea.style.fontFamily = '"Times New Roman", Times, Georgia, serif';
            } else {
                textarea.style.fontFamily = 'Helvetica, Arial, sans-serif';
            }

            // ENTER KEY COMMITS AND IMMEDIATELY SAVES TO PDF!
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (e.shiftKey) {
                        // Shift+Enter creates a newline inside textarea
                        return;
                    }
                    // Enter commits and saves immediately!
                    e.preventDefault();
                    commitActiveInput();
                } else if (e.key === 'Escape') {
                    closeActiveInput();
                }
            });

            interactiveOverlay.appendChild(textarea);
            textarea.focus();
            textarea.select();
            activeInput = textarea;

            updateToolbarStyleButtons();
            positionFloatingToolbar(textarea);
        }

            textarea.addEventListener('keydown', (e) => {

        expandParagraphBtn.addEventListener('click', () => {

        function updateToolbarStyleButtons() {
            if (!activeEditTarget) return;
            if (activeEditTarget.is_bold) {
                boldToggleBtn.className = 'px-2.5 py-0.5 rounded font-bold text-xs bg-blue-600 text-white shadow-sm transition';
            } else {

            }

            }

        async function goToNextMatch() {
            if (flatMatches.length === 0) return;
            currentMatchIndex = (currentMatchIndex + 1) % flatMatches.length;
            findMatchesCountBadge.innerText = `${currentMatchIndex + 1} of ${flatMatches.length} matches`;

            let toolLeft = rect.left - wrapperRect.left;
            let toolTop = rect.top - wrapperRect.top - 46;

            if (toolTop < 0) toolTop = rect.bottom - wrapperRect.top + 8;

            floatingToolbar.style.left = `${toolLeft}px`;
            floatingToolbar.style.top = `${toolTop}px`;

            fontSizeDisplay.innerText = `${activeEditTarget.size.toFixed(1)}pt`;
            colorPicker.value = activeEditTarget.color.length === 7 ? activeEditTarget.color : '#000000';
            pageWrapper.appendChild(floatingToolbar);
        }

        function closeActiveInput() {
            if (activeInput) {
                activeInput.remove();
                activeInput = null;
            }
            floatingToolbar.classList.add('hidden');
            if (expandParagraphBtn) {
                expandParagraphBtn.classList.add('hidden');
                expandParagraphBtn.classList.remove('flex');
            }
            activeEditTarget = null;
        }

        // COMMIT & IMMEDIATELY RE-RENDER FROM SERVER
        async function commitActiveInput() {
            if (!activeInput || !activeEditTarget) return;

            const val = activeInput.value;
            if (val === '') {
                closeActiveInput();
                return;
            }

            // Guard: If editing existing text and nothing changed, abort silently
            const originalText = activeEditTarget.text || (activeEditTarget.block ? activeEditTarget.block.text : (activeEditTarget.span ? activeEditTarget.span.text : ''));
            if (!activeEditTarget.isNew && val.trim() === originalText.trim() && !activeEditTarget.customSize) {
                closeActiveInput();
                return;
            }

            // Guard: If clicking blank area and leaving placeholder unchanged, abort silently
            if (activeEditTarget.isNew && (val === 'New Text' || val.trim() === '')) {
                closeActiveInput();
                return;
            }

            liveStatusMsg.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Saving changes to PDF...';
            lucide.createIcons();

            let editPayload = null;

            if (activeEditTarget.isNew) {
                editPayload = {
                    type: 'add',
                    page_index: currentPageIndex,
                    x: activeEditTarget.x,
                    y: activeEditTarget.y,
                    newText: val.trim(),
                    size: activeEditTarget.size,
                    color: activeEditTarget.color,
                    is_bold: Boolean(activeEditTarget.is_bold),
                    is_italic: Boolean(activeEditTarget.is_italic)
                };
            } else {
                const targetBbox = activeEditTarget.bbox || (activeEditTarget.block ? activeEditTarget.block.bbox : activeEditTarget.span.bbox);
                const targetOldText = originalText;
                const targetFont = activeEditTarget.font || (activeEditTarget.block ? activeEditTarget.block.font : activeEditTarget.span.font);
                const targetFlags = (activeEditTarget.flags !== undefined) ? activeEditTarget.flags : (activeEditTarget.block ? activeEditTarget.block.flags : 0);

                editPayload = {
                    type: 'replace',
                    page_index: currentPageIndex,
                    bbox: targetBbox,
                    origin: activeEditTarget.origin || null,
                    oldText: targetOldText,
                    newText: val.trim(),
                    size: activeEditTarget.size,
                    color: activeEditTarget.color,
                    font: targetFont,
                    flags: targetFlags,
                    is_bold: Boolean(activeEditTarget.is_bold),
                    is_italic: Boolean(activeEditTarget.is_italic),
                    is_paragraph: Boolean(activeEditTarget.is_paragraph) || val.includes('\n'),
                    custom_size: Boolean(activeEditTarget.customSize)
                };
            }
        }

        async function goToPrevMatch() {
            if (flatMatches.length === 0) return;
            currentMatchIndex = (currentMatchIndex - 1 + flatMatches.length) % flatMatches.length;
            findMatchesCountBadge.innerText = `${currentMatchIndex + 1} of ${flatMatches.length} matches`;

            const targetMatch = flatMatches[currentMatchIndex];
            if (targetMatch.page_index !== currentPageIndex) {
                await loadPage(targetMatch.page_index);
            } else {
                renderSearchHighlights();
            }
        }

        findNextBtn.addEventListener('click', goToNextMatch);
        findPrevBtn.addEventListener('click', goToPrevMatch);

        // Replace Single Next Match
        findReplaceCurrentBtn.addEventListener('click', async () => {
            if (flatMatches.length === 0 || currentMatchIndex < 0) return;
            const targetMatch = flatMatches[currentMatchIndex];
            const searchTxt = findSearchInput.value.trim();
            const replaceTxt = findReplaceInput.value.trim();

            if (!searchTxt) return;

            setStatus('Replacing occurrence with anti-overlap reflow...', 'loading');

            const payload = {
                type: 'replace',
                page_index: targetMatch.page_index,
                bbox: targetMatch.bbox,
                oldText: searchTxt,
                newText: replaceTxt,
                reflow: findReflowToggle.checked
            };

            try {
                const res = await fetch('/api/apply_edit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const resData = await res.json();
                if (resData.status === 'success') {
                    renderPageData(resData.data);
                    setStatus('Replaced 1 occurrence cleanly!', 'success');
                    await triggerSearch();
                } else {
                    alert('Error replacing: ' + resData.message);
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            } finally {
                closeActiveInput();
            }
        }

        // Toolbar controls
        sizeMinusBtn.addEventListener('click', () => {
            if (activeEditTarget) {
                activeEditTarget.size = Math.max(activeEditTarget.size - 0.5, 6);

        sizePlusBtn.addEventListener('click', () => {

                activeEditTarget.customSize = true;
                fontSizeDisplay.innerText = `${activeEditTarget.size.toFixed(1)}pt`;
                if (activeInput) {
                    activeInput.style.fontSize = `${activeEditTarget.size * (pdfPageImage.clientHeight / originalPageHeight)}px`;
                }
            }
        });

        boldToggleBtn.addEventListener('click', () => {
            if (!activeEditTarget) return;
            activeEditTarget.is_bold = !activeEditTarget.is_bold;

        italicToggleBtn.addEventListener('click', () => {

            activeEditTarget.is_italic = !activeEditTarget.is_italic;

        colorPicker.addEventListener('input', (e) => {

                if (activeInput) {
                    activeInput.style.color = activeEditTarget.color;
                }
            }
        });

        saveEditBtn.addEventListener('click', () => {

        });

        deleteTextBtn.addEventListener('click', async () => {
            if (!activeEditTarget || activeEditTarget.isNew) {
                closeActiveInput();
                return;
            }

            const allPages = findScopeAllPages.checked;
            const scopeLabel = allPages ? 'across the entire PDF' : `on page ${currentPageIndex + 1}`;
            setStatus(`Replacing all occurrences of "${searchTxt}" ${scopeLabel}...`, 'loading');

            const payload = {
                search_text: searchTxt,
                replace_text: replaceTxt,
                all_pages: allPages,
                page_index: currentPageIndex,
                reflow: findReflowToggle.checked
            };

            try {
                const res = await fetch('/api/replace_all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const resData = await res.json();
                if (resData.status === 'success') {
                    renderPageData(resData.data);
                    const count = resData.total_replaced;
                    const pages = resData.pages_affected;
                    setStatus(`Successfully replaced ${count} occurrences across ${pages} page(s) with zero overlap!`, 'success');
                    findMatchesCountBadge.innerText = '0 matches';
                    clearSearchHighlights();
                    flatMatches = [];
                    currentMatchIndex = -1;
                } else {
                    alert('Error in Replace All: ' + resData.message);
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            }
        });

        function updateStyleButtons() {
            if (!activeEditorTarget) return;
            const isBold = Boolean(activeEditorTarget.flags & 2);
            const isItalic = Boolean(activeEditorTarget.flags & 1);

            if (isBold) {
                styleBoldBtn.classList.add('bg-blue-600', 'text-white');
            } else {
                styleBoldBtn.classList.remove('bg-blue-600', 'text-white');

            if (isItalic) {
                styleItalicBtn.classList.add('bg-blue-600', 'text-white');

        function closeEditorCard() {
            editorCard.classList.add('hidden');
            ghostPlacementBox.classList.add('hidden');

        }

        editorDragHeader.addEventListener('mousedown', (e) => {
            if (e.target.closest('#editorCloseBtn')) return;
            isDraggingEditor = true;
            dragStartMouseX = e.clientX;
            dragStartMouseY = e.clientY;

            const rect = editorCard.getBoundingClientRect();
            const wrapperRect = pageWrapper.getBoundingClientRect();
            dragStartCardX = rect.left - wrapperRect.left;
            dragStartCardY = rect.top - wrapperRect.top;

            window.addEventListener('mousemove', onEditorMouseMove);
            window.addEventListener('mouseup', onEditorMouseUp);
        });

        function onEditorMouseMove(e) {
            if (!isDraggingEditor || !activeEditorTarget) return;

            const deltaX = (e.clientX - dragStartMouseX) / zoomLevel;
            const deltaY = (e.clientY - dragStartMouseY) / zoomLevel;

            let newCardX = dragStartCardX + deltaX;
            let newCardY = dragStartCardY + deltaY;

            const wrapperWidth = pageWrapper.clientWidth;
            const wrapperHeight = pageWrapper.clientHeight;

            newCardX = Math.max(0, Math.min(newCardX, wrapperWidth - editorCard.clientWidth));
            newCardY = Math.max(0, Math.min(newCardY, wrapperHeight - 60));

            editorCard.style.left = `${newCardX}px`;
            editorCard.style.top = `${newCardY}px`;

            const scaleX = pdfPageImage.clientWidth / originalPageWidth;
            const scaleY = pdfPageImage.clientHeight / originalPageHeight;

            activeEditorTarget.x = newCardX / scaleX;
            activeEditorTarget.y = newCardY / scaleY;

            posCoordsBadge.innerText = `X: ${Math.round(activeEditorTarget.x)}, Y: ${Math.round(activeEditorTarget.y)}`;

            ghostPlacementBox.style.left = `${newCardX}px`;
            ghostPlacementBox.style.top = `${newCardY}px`;

            if (Math.abs(activeEditorTarget.x - activeEditorTarget.origX) > 2 || Math.abs(activeEditorTarget.y - activeEditorTarget.origY) > 2) {
                movedIndicator.classList.remove('hidden');
            }

        function onEditorMouseUp() {

            window.removeEventListener('mousemove', onEditorMouseMove);
            window.removeEventListener('mouseup', onEditorMouseUp);
        }

        window.addEventListener('keydown', (e) => {
            if (!activeEditorTarget) return;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key) && document.activeElement !== editorTextInput) {
                e.preventDefault();
                const step = e.shiftKey ? 10 : 1;
                const scaleX = pdfPageImage.clientWidth / originalPageWidth;
                const scaleY = pdfPageImage.clientHeight / originalPageHeight;

                if (e.key === 'ArrowLeft') activeEditorTarget.x = Math.max(0, activeEditorTarget.x - step);
                if (e.key === 'ArrowRight') activeEditorTarget.x = Math.min(originalPageWidth, activeEditorTarget.x + step);
                if (e.key === 'ArrowUp') activeEditorTarget.y = Math.max(0, activeEditorTarget.y - step);
                if (e.key === 'ArrowDown') activeEditorTarget.y = Math.min(originalPageHeight, activeEditorTarget.y + step);

                const pixelX = activeEditorTarget.x * scaleX;
                const pixelY = activeEditorTarget.y * scaleY;

                ghostPlacementBox.style.left = `${pixelX}px`;
                ghostPlacementBox.style.top = `${pixelY}px`;
                posCoordsBadge.innerText = `X: ${Math.round(activeEditorTarget.x)}, Y: ${Math.round(activeEditorTarget.y)}`;

        async function commitActiveEditor() {
            if (!activeEditorTarget) return;

            const newTextVal = editorTextInput.value.trim();
            if (!newTextVal) {
                closeEditorCard();
                return;
            }

            const isPositionChanged = (
                Math.abs(activeEditorTarget.x - activeEditorTarget.origX) > 1 ||
                Math.abs(activeEditorTarget.y - activeEditorTarget.origY) > 1
            );

            if (!activeEditorTarget.isNew && newTextVal === activeEditorTarget.origItem.text && !isPositionChanged) {
                closeEditorCard();
                return;
            }

            setStatus('Reflowing & applying clean edit...', 'loading');

            let payload = null;

            if (activeEditorTarget.isNew) {
                payload = {
                    type: 'add',
                    page_index: currentPageIndex,
                    newText: newTextVal,
                    x: activeEditorTarget.x,
                    y: activeEditorTarget.y,
                    size: activeEditorTarget.size,
                    color: activeEditorTarget.color,
                    font: activeEditorTarget.font,
                    flags: activeEditorTarget.flags
                };
            } else {
                payload = {
                    type: isPositionChanged ? 'move' : 'replace',
                    page_index: currentPageIndex,
                    bbox: activeEditorTarget.origItem.bbox,
                    oldText: activeEditorTarget.origItem.text,
                    newText: newTextVal,
                    size: activeEditorTarget.size,
                    color: activeEditorTarget.color,
                    font: activeEditorTarget.font,
                    flags: activeEditorTarget.flags,
                    reflow: editorReflowToggle.checked
                };
                if (isPositionChanged) {
                    payload.new_x = activeEditorTarget.x;
                    payload.new_y = activeEditorTarget.y;
                }
            }

            closeEditorCard();

            try {
                const res = await fetch('/api/apply_edit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const resData = await res.json();

                if (resData.status === 'success') {
                    renderPageData(resData.data);
                    setStatus('Edit applied seamlessly with anti-overlap reflow!', 'success');
                } else {
                    alert('Error applying edit: ' + resData.message);
                    setStatus('Error applying edit', 'error');
                }
            } catch (err) {
                alert('Network error: ' + err.message);
                setStatus('Network error', 'error');
            }
        }

        editorEraseBtn.addEventListener('click', async () => {
            if (!activeEditorTarget) return;
            if (activeEditorTarget.isNew) {
                closeEditorCard();
                return;
            }

            setStatus('Erasing text...', 'loading');
            const payload = {
                type: 'redact',
                page_index: currentPageIndex,
                bbox: activeEditorTarget.origItem.bbox

            closeEditorCard();

        function openImageInspector(img, pixelLeft, pixelTop, pixelWidth, pixelHeight) {
            closeEditorCard();

            newImageBase64 = null;

            let cardLeft = pixelLeft;

            imageCard.style.top = `${cardTop}px`;

        function max1(v) {
            return v > 0 ? v : 1;
        }

        });

        function onImgCardMouseMove(e) {
            if (!isDraggingImageCard) return;

            const deltaX = (e.clientX - dragStartMouseX) / zoomLevel;
            const deltaY = (e.clientY - dragStartMouseY) / zoomLevel;

            let newCardX = dragStartImgCardX + deltaX;

        replaceImageFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                newImageBase64 = reader.result;

                const imgObj = new Image();
                imgObj.onload = () => {
                    const natW = imgObj.naturalWidth;
                    const natH = imgObj.naturalHeight;
                    newImageNaturalRatio = natH / max1(natW);

                    imgPixelInfo.innerText = `New: ${natW}×${natH} px (${file.type.split('/')[1].toUpperCase()})`;
                    imgPreviewThumb.innerHTML = `<img src="${newImageBase64}" class="w-full h-full object-cover">`;

                    const currentW = parseFloat(imgTargetWidth.value) || activeImageTarget.origWidth;
                    const computedH = Math.round(currentW * newImageNaturalRatio);
                    imgTargetHeight.value = computedH;

                    updateImageDeltaDisplay();
                };
                imgObj.src = newImageBase64;
            };
            reader.readAsDataURL(file);
        });

        imgTargetWidth.addEventListener('input', () => {
            if (imgLockAspect.checked) {
                const w = parseFloat(imgTargetWidth.value) || 0;
                imgTargetHeight.value = Math.round(w * newImageNaturalRatio);
            }
            updateImageDeltaDisplay();
        });

        imgTargetHeight.addEventListener('input', () => {
            if (imgLockAspect.checked) {
                const h = parseFloat(imgTargetHeight.value) || 0;
                imgTargetWidth.value = Math.round(h / max1(newImageNaturalRatio));
            }
            updateImageDeltaDisplay();
        });

        function updateImageDeltaDisplay() {
            if (!activeImageTarget) return;
            const newH = parseFloat(imgTargetHeight.value) || activeImageTarget.origHeight;
            const deltaY = newH - activeImageTarget.origHeight;

            if (deltaY > 0) {
                imgDeltaIndicator.innerText = `Δy: +${Math.round(deltaY)} pt (Shifts down)`;
                imgDeltaIndicator.className = 'text-[10px] font-mono text-amber-400 font-semibold';
            } else if (deltaY < 0) {
                imgDeltaIndicator.innerText = `Δy: ${Math.round(deltaY)} pt (Shifts up)`;
                imgDeltaIndicator.className = 'text-[10px] font-mono text-blue-400 font-semibold';
            } else {
                imgDeltaIndicator.innerText = 'Δy: 0 pt';
                imgDeltaIndicator.className = 'text-[10px] font-mono text-slate-400';
            }
        }

        // -------------------------------------------------------------
        // Area Selection / Marquee Tool
        // -------------------------------------------------------------
        interactiveOverlay.addEventListener('mousedown', (e) => {
            if (activeTool !== 'eraseArea') return;

            isMarqueeActive = true;
            const rect = pageWrapper.getBoundingClientRect();
            marqueeStartX = (e.clientX - rect.left) / zoomLevel;
            marqueeStartY = (e.clientY - rect.top) / zoomLevel;

            selectionMarquee.style.left = `${marqueeStartX}px`;
            selectionMarquee.style.top = `${marqueeStartY}px`;
            selectionMarquee.style.width = '0px';
            selectionMarquee.style.height = '0px';
            selectionMarquee.classList.remove('hidden');

            window.addEventListener('mousemove', onMarqueeMouseMove);
            window.addEventListener('mouseup', onMarqueeMouseUp);
        });

        function onMarqueeMouseMove(e) {
            if (!isMarqueeActive) return;

            const rect = pageWrapper.getBoundingClientRect();
            const currentX = (e.clientX - rect.left) / zoomLevel;
            const currentY = (e.clientY - rect.top) / zoomLevel;

            const left = Math.min(marqueeStartX, currentX);
            const top = Math.min(marqueeStartY, currentY);
            const width = Math.abs(currentX - marqueeStartX);
            const height = Math.abs(currentY - marqueeStartY);

            selectionMarquee.style.left = `${left}px`;
            selectionMarquee.style.top = `${top}px`;
            selectionMarquee.style.width = `${width}px`;
            selectionMarquee.style.height = `${height}px`;
        }

        function onMarqueeMouseUp(e) {
            if (!isMarqueeActive) return;
            isMarqueeActive = false;
            window.removeEventListener('mousemove', onMarqueeMouseMove);
            window.removeEventListener('mouseup', onMarqueeMouseUp);

            const rect = pageWrapper.getBoundingClientRect();
            const currentX = (e.clientX - rect.left) / zoomLevel;
            const currentY = (e.clientY - rect.top) / zoomLevel;

            const left = Math.min(marqueeStartX, currentX);
            const top = Math.min(marqueeStartY, currentY);
            const width = Math.abs(currentX - marqueeStartX);
            const height = Math.abs(currentY - marqueeStartY);

            if (width < 10 || height < 10) {
                selectionMarquee.classList.add('hidden');
                return;
            }

            const scaleX = pdfPageImage.clientWidth / originalPageWidth;
            const scaleY = pdfPageImage.clientHeight / originalPageHeight;

            marqueeRect = [
                left / scaleX,
                top / scaleY,
                (left + width) / scaleX,
                (top + height) / scaleY
            ];

            areaActionModal.style.left = `${Math.min(left + width + 10, pageWrapper.clientWidth - 220)}px`;
            areaActionModal.style.top = `${top}px`;
            pageWrapper.appendChild(areaActionModal);
            areaActionModal.classList.remove('hidden');

        // -------------------------------------------------------------
        function setActiveTool(tool) {
            activeTool = tool;
            [toolSelectBtn, toolAddTextBtn, toolEraseAreaBtn, toolPanBtn].forEach(btn => btn.classList.remove('active'));

            if (tool === 'select') {
                toolSelectBtn.classList.add('active');
                interactiveOverlay.style.cursor = 'pointer';
                modeDescription.innerHTML = '<i data-lucide="mouse-pointer" class="w-3.5 h-3.5 text-blue-400"></i><span><strong>Click any word, text box, or image</strong> to edit. Expanding content automatically shifts subsequent words & lower paragraphs!</span>';

                toolAddTextBtn.classList.add('active');
                interactiveOverlay.style.cursor = 'crosshair';
                modeDescription.innerHTML = '<i data-lucide="plus-circle" class="w-3.5 h-3.5 text-emerald-400"></i><span><strong>Click anywhere on the PDF</strong> to place a new draggable text box.</span>';
            } else if (tool === 'eraseArea') {
                toolEraseAreaBtn.classList.add('active');
                interactiveOverlay.style.cursor = 'crosshair';
                modeDescription.innerHTML = '<i data-lucide="square-dashed" class="w-3.5 h-3.5 text-rose-400"></i><span><strong>Click and drag a rectangle</strong> over any section to whiteout / erase it.</span>';

                toolPanBtn.classList.add('active');
                interactiveOverlay.style.cursor = 'grab';
                modeDescription.innerHTML = '<i data-lucide="hand" class="w-3.5 h-3.5 text-slate-300"></i><span><strong>Click and drag</strong> to pan around the page canvas.</span>';
            }

            lucide.createIcons();
            rebuildInteractiveOverlay();
        }

        toolEraseAreaBtn.addEventListener('click', () => setActiveTool('eraseArea'));

        function setGranularity(gran) {
            activeGranularity = gran;
            [granWordBtn, granLineBtn, granBlockBtn].forEach(btn => btn.classList.remove('active'));

            if (gran === 'word') {
                granWordBtn.classList.add('active');
            } else if (gran === 'line') {
                granLineBtn.classList.add('active');
            } else if (gran === 'block') {
                granBlockBtn.classList.add('active');
            }

            if (activeTool !== 'select') {
                setActiveTool('select');
            } else {
                rebuildInteractiveOverlay();
            }
        }

        undoBtn.addEventListener('click', async () => {
            setStatus('Undoing edit...', 'loading');
            try {
                const res = await fetch('/api/undo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_index: currentPageIndex })
                });
                const resData = await res.json();
                if (resData.status === 'success') {
                    renderPageData(resData.data);
                    setStatus('Undone', 'success');
                }
            } catch (err) {
                alert('Undo error: ' + err.message);
            }
        });

        redoBtn.addEventListener('click', async () => {
            setStatus('Redoing edit...', 'loading');
            try {
                const res = await fetch('/api/redo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_index: currentPageIndex })
                });
                const resData = await res.json();
                if (resData.status === 'success') {
                    renderPageData(resData.data);
                    setStatus('Redone', 'success');
                }
            } catch (err) {
                alert('Redo error: ' + err.message);
            }
        });

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                if (e.shiftKey) {
                    if (!redoBtn.disabled) redoBtn.click();
                } else {
                    if (!undoBtn.disabled) undoBtn.click();
                }
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                e.preventDefault();
                if (!redoBtn.disabled) redoBtn.click();
            }
        });

        // -------------------------------------------------------------
        // Zoom & Pagination
        // -------------------------------------------------------------
        zoomInBtn.addEventListener('click', () => {
            zoomLevel = Math.min(zoomLevel + 0.15, 2.5);
            applyZoom();
        });

        zoomOutBtn.addEventListener('click', () => {
            zoomLevel = Math.max(zoomLevel - 0.15, 0.4);
            applyZoom();
        });

        zoomResetBtn.addEventListener('click', () => {
            zoomLevel = 1.0;
            applyZoom();
        });

        fitWidthBtn.addEventListener('click', () => {
            const containerWidth = viewportContainer.clientWidth - 80;
            zoomLevel = containerWidth / pageWrapper.clientWidth;
            applyZoom();
        });

        viewportContainer.addEventListener('wheel', (e) => {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.1 : -0.1;
                zoomLevel = Math.min(Math.max(zoomLevel + delta, 0.4), 2.5);
                applyZoom();
            }
        }, { passive: false });

        function applyZoom() {
            pageWrapper.style.transform = `scale(${zoomLevel})`;
            zoomLabel.innerText = `${Math.round(zoomLevel * 100)}%`;
        }

        prevPageBtn.addEventListener('click', () => {
            if (currentPageIndex > 0) loadPage(currentPageIndex - 1);
        });

        nextPageBtn.addEventListener('click', () => {
            if (currentPageIndex < totalPages - 1) loadPage(currentPageIndex + 1);
        });

        // -------------------------------------------------------------
        // Custom File Upload & Export
        // -------------------------------------------------------------
        pdfFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            setStatus('Uploading & indexing PDF...', 'loading');

            const reader = new FileReader();
            reader.onload = async () => {
                const base64Data = reader.result;
                try {
                    const res = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pdf_base64: base64Data })
                    });
                    const resData = await res.json();
                    if (resData.status === 'success') {
                        renderPageData(resData.data);
                        setStatus('Custom PDF Loaded & Indexed!', 'success');
                    } else {
                        alert('Failed to load PDF: ' + resData.message);
                        setStatus('Failed to load PDF', 'error');
                    }
                } catch (err) {
                    alert('Upload failed: ' + err.message);
                }
            };
            reader.readAsDataURL(file);
        });

        downloadPdfBtn.addEventListener('click', async () => {
            const origHtml = downloadPdfBtn.innerHTML;
            downloadPdfBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Exporting Clean PDF...</span>';
            lucide.createIcons();

            try {
                const res = await fetch('/api/export', { method: 'POST' });
                const data = await res.json();

                if (data.status === 'success') {
                    const byteChars = atob(data.pdf_base64);
                    const byteNumbers = new Array(byteChars.length);
                    for (let i = 0; i < byteChars.length; i++) {
                        byteNumbers[i] = byteChars.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: 'application/pdf' });

                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = data.filename || 'edited_clean.pdf';
                    link.click();
                    setStatus('Clean PDF Downloaded!', 'success');
                } else {
                    alert('Export failed: ' + data.message);
                }
            } catch (err) {
                alert('Export error: ' + err.message);
            } finally {
                downloadPdfBtn.innerHTML = origHtml;
                lucide.createIcons();
            }
        });

        function setStatus(text, type = 'info') {
            let icon = 'check-circle';
            let colorClass = 'text-emerald-400';

            if (type === 'loading') {
                icon = 'loader-2';
                colorClass = 'text-blue-400 animate-spin';
            } else if (type === 'error') {
                icon = 'alert-circle';
                colorClass = 'text-rose-400';
            }

            liveStatusMsg.innerHTML = `<i data-lucide="${icon}" class="w-3.5 h-3.5 ${colorClass}"></i><span>${text}</span>`;
            lucide.createIcons();
        }

        window.addEventListener('resize', () => {
            rebuildInteractiveOverlay();
            renderSearchHighlights();
        });

        // Initial Load
        loadPage(0);
    </script>
</body>
</html>
