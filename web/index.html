<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostPDF Studio - Low-Level Stream Editor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .page-container {
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            user-select: none;
        }
        .text-overlay-box {
            position: absolute;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.1s ease;
        }
        .text-overlay-box:hover {
            background-color: rgba(59, 130, 246, 0.16);
            outline: 2px dashed #2563EB;
            outline-offset: 1px;
        }
        .active-inline-box {
            position: absolute;
            border: 2px solid #2563EB;
            background: rgba(255, 255, 255, 0.98);
            outline: none;
            padding: 4px 6px;
            border-radius: 4px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            z-index: 50;
            resize: both;
            overflow: auto;
            line-height: 1.35;
        }
        .floating-toolbar {
            position: absolute;
            background: #0F172A;
            color: white;
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
            z-index: 60;
            font-size: 13px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm z-30">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold flex items-center justify-center">
                    <i data-lucide="zap" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-900">GhostPDF Studio</h1>
                    <span class="text-xs font-semibold px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full">Low-Level Byte Stream Engine</span>
                </div>
            </div>

            <div class="h-6 w-px bg-slate-300 mx-2"></div>

            <!-- Upload Custom File -->
            <label class="cursor-pointer flex items-center gap-2 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-md text-sm font-medium transition">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span>Open Custom PDF</span>
                <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden">
            </label>
        </div>

        <!-- Center: Pagination & Zoom -->
        <div class="flex items-center gap-3 bg-slate-100 px-3 py-1 rounded-lg text-sm">
            <button id="prevPageBtn" class="p-1 hover:bg-white rounded transition text-slate-600 hover:text-slate-900 disabled:opacity-30">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <span id="pageIndicator" class="font-medium text-slate-700">Page 1 of 1</span>
            <button id="nextPageBtn" class="p-1 hover:bg-white rounded transition text-slate-600 hover:text-slate-900 disabled:opacity-30">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>

            <div class="h-4 w-px bg-slate-300 mx-1"></div>

            <button id="zoomOutBtn" class="p-1 hover:bg-white rounded transition text-slate-600">
                <i data-lucide="minus" class="w-4 h-4"></i>
            </button>
            <span id="zoomLabel" class="w-12 text-center font-medium">100%</span>
            <button id="zoomInBtn" class="p-1 hover:bg-white rounded transition text-slate-600">
                <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Right: Actions -->
        <div class="flex items-center gap-3">
            <button id="downloadPdfBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold shadow-sm transition flex items-center gap-2">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Download Clean PDF</span>
            </button>
        </div>
    </header>

    <!-- Sub-bar: Instructions & Live Status -->
    <div class="bg-blue-50 border-b border-blue-100 px-6 py-2 text-xs text-blue-900 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i data-lucide="info" class="w-4 h-4 text-blue-600"></i>
            <span><strong>Click on any text</strong> to open the multi-line editing box. Edit lines or full paragraphs. Press <strong>Ctrl+Enter</strong> or click <strong>Apply</strong>!</span>
        </div>
        <div id="liveStatusMsg" class="font-semibold text-emerald-700 flex items-center gap-1.5">
            <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
            <span>Ready for Click-to-Edit</span>
        </div>
    </div>

    <!-- Main Workspace Viewport -->
    <main id="viewportContainer" class="flex-1 overflow-auto p-8 flex justify-center items-start bg-slate-200">
        <div id="pageWrapper" class="page-container relative bg-white transition-transform origin-top">
            <!-- Background Rendered Page Image -->
            <img id="pdfPageImage" src="" alt="PDF Page" class="block w-full h-auto select-none pointer-events-none" draggable="false">

            <!-- Interactive Click-to-Edit Layer -->
            <div id="interactiveOverlay" class="absolute inset-0 cursor-text"></div>
        </div>
    </main>

    <!-- Floating Format Bar (Appears on Active Selection) -->
    <div id="floatingToolbar" class="floating-toolbar hidden">
        <span class="font-medium text-slate-400 text-xs">Size:</span>
        <button id="sizeMinusBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded font-bold">-</button>
        <span id="fontSizeDisplay" class="font-mono text-xs text-emerald-400">12pt</span>
        <button id="sizePlusBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded font-bold">+</button>

        <div class="h-4 w-px bg-slate-700 mx-1"></div>

        <button id="boldToggleBtn" class="px-2.5 py-0.5 rounded font-bold text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition" title="Toggle Bold">B</button>
        <button id="italicToggleBtn" class="px-2.5 py-0.5 rounded italic font-serif text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition" title="Toggle Italic">I</button>

        <div class="h-4 w-px bg-slate-700 mx-1"></div>

        <button id="expandParagraphBtn" class="px-2.5 py-0.5 rounded text-xs bg-slate-800 text-blue-300 hover:bg-slate-700 transition hidden items-center gap-1 font-medium" title="Expand selection to edit entire paragraph">
            <i data-lucide="align-left" class="w-3.5 h-3.5"></i>
            <span>Edit Paragraph</span>
        </button>

        <div class="h-4 w-px bg-slate-700 mx-1"></div>

        <input type="color" id="colorPicker" value="#000000" class="w-6 h-6 bg-transparent cursor-pointer rounded border-0">

        <div class="h-4 w-px bg-slate-700 mx-1"></div>

        <button id="deleteTextBtn" class="px-2 py-1 bg-rose-600 hover:bg-rose-700 rounded text-xs flex items-center gap-1 transition" title="Clean Whiteout">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span>Erase</span>
        </button>

        <button id="saveEditBtn" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 rounded text-xs font-semibold flex items-center gap-1.5 transition">
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
            <span>Apply</span>
            <kbd class="text-[9px] text-emerald-100 bg-emerald-800/80 px-1 py-0.5 rounded uppercase font-mono font-normal">Enter ↵</kbd>
        </button>
    </div>

    <script>
        let currentPageIndex = 0;
        let totalPages = 1;
        let originalPageWidth = 595;
        let originalPageHeight = 842;
        let zoomLevel = 1.0;
        let pageSpans = [];
        let pageBlocks = [];

        let activeInput = null;
        let activeEditTarget = null;

        const pdfPageImage = document.getElementById('pdfPageImage');
        const interactiveOverlay = document.getElementById('interactiveOverlay');
        const pageWrapper = document.getElementById('pageWrapper');
        const floatingToolbar = document.getElementById('floatingToolbar');
        const pageIndicator = document.getElementById('pageIndicator');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const zoomLabel = document.getElementById('zoomLabel');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const pdfFileInput = document.getElementById('pdfFileInput');
        const downloadPdfBtn = document.getElementById('downloadPdfBtn');
        const liveStatusMsg = document.getElementById('liveStatusMsg');

        const fontSizeDisplay = document.getElementById('fontSizeDisplay');
        const sizeMinusBtn = document.getElementById('sizeMinusBtn');
        const sizePlusBtn = document.getElementById('sizePlusBtn');
        const boldToggleBtn = document.getElementById('boldToggleBtn');
        const italicToggleBtn = document.getElementById('italicToggleBtn');
        const expandParagraphBtn = document.getElementById('expandParagraphBtn');
        const colorPicker = document.getElementById('colorPicker');
        const deleteTextBtn = document.getElementById('deleteTextBtn');
        const saveEditBtn = document.getElementById('saveEditBtn');

        lucide.createIcons();

        async function loadPage(pageIdx = 0) {
            try {
                const res = await fetch(`/api/page?num=${pageIdx}`);
                const data = await res.json();
                renderPageData(data);
            } catch (err) {
                const res = await fetch('/api/sample');
                const data = await res.json();
                renderPageData(data);
            }
        }

        function renderPageData(data) {
            currentPageIndex = data.page_index;
            totalPages = data.total_pages;
            originalPageWidth = data.width;
            originalPageHeight = data.height;
            pageSpans = data.spans;
            pageBlocks = data.blocks || [];

            pageIndicator.innerText = `Page ${currentPageIndex + 1} of ${totalPages}`;
            prevPageBtn.disabled = (currentPageIndex <= 0);
            nextPageBtn.disabled = (currentPageIndex >= totalPages - 1);

            pdfPageImage.src = data.image;
            pdfPageImage.onload = () => {
                rebuildInteractiveOverlay();
            };
        }

        function rebuildInteractiveOverlay() {
            interactiveOverlay.innerHTML = '';
            closeActiveInput();

            const renderWidth = pdfPageImage.clientWidth;
            const renderHeight = pdfPageImage.clientHeight;
            const scaleX = renderWidth / originalPageWidth;
            const scaleY = renderHeight / originalPageHeight;

            // Render block-level interactive boxes so users can select and edit whole multi-line blocks/paragraphs at once
            const itemsToRender = (pageBlocks && pageBlocks.length > 0) ? pageBlocks : pageSpans;

            itemsToRender.forEach(item => {
                const [x0, y0, x1, y1] = item.bbox;
                const left = x0 * scaleX;
                const top = y0 * scaleY;
                const width = Math.max((x1 - x0) * scaleX, 16);
                const height = Math.max((y1 - y0) * scaleY, 14);

                const box = document.createElement('div');
                box.className = 'text-overlay-box';
                box.style.left = `${left}px`;
                box.style.top = `${top}px`;
                box.style.width = `${width}px`;
                box.style.height = `${height}px`;

                const previewText = item.text.replace(/\s+/g, ' ').trim().substring(0, 40);
                box.title = `Click to edit: "${previewText}..." (${item.line_count || 1} lines)`;

                box.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openBlockEditor(item, box);
                });

                interactiveOverlay.appendChild(box);
            });
        }

        // CLICK ON BLANK AREA -> Add New Text
        interactiveOverlay.addEventListener('click', (e) => {
            if (activeInput) {
                commitActiveInput();
                return;
            }

            const rect = interactiveOverlay.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const scaleX = pdfPageImage.clientWidth / originalPageWidth;
            const scaleY = pdfPageImage.clientHeight / originalPageHeight;

            const pdfX = clickX / scaleX;
            const pdfY = clickY / scaleY;

            const newObj = {
                isNew: true,
                x: pdfX,
                y: pdfY,
                newText: 'New Text',
                size: 12.0,
                color: '#1E293B',
                font: 'helv'
            };

            openInlineEditorForNewText(newObj, clickX, clickY);
        });

        function openBlockEditor(item, boxElement) {
            closeActiveInput();

            const isBoldInitial = Boolean(item.is_bold) || Boolean(item.flags & 16) || /-bold|_bold|\bbold\b|\bheavy\b|\bblack\b/i.test(item.font);
            const isItalicInitial = Boolean(item.is_italic) || Boolean(item.flags & 2) || /-italic|_italic|\bitalic\b|\boblique\b/i.test(item.font);

            activeEditTarget = {
                isNew: false,
                block: item,
                bbox: item.bbox,
                origin: item.origin || null,
                text: item.text,
                size: item.size,
                color: item.color,
                font: item.font,
                flags: item.flags || 0,
                is_bold: isBoldInitial,
                is_italic: isItalicInitial,
                is_paragraph: Boolean(item.line_count > 1 || item.text.includes('\n')),
                customSize: false
            };

            const textarea = document.createElement('textarea');
            textarea.className = 'active-inline-box';
            textarea.value = item.text;

            const scaleX = pdfPageImage.clientWidth / originalPageWidth;
            const scaleY = pdfPageImage.clientHeight / originalPageHeight;
            const [bx0, by0, bx1, by1] = item.bbox;

            const screenLeft = bx0 * scaleX;
            const screenTop = by0 * scaleY;
            const screenWidth = Math.max((bx1 - bx0) * scaleX + 16, 260);
            const screenHeight = Math.max((by1 - by0) * scaleY + 16, 44);

            textarea.style.left = `${screenLeft}px`;
            textarea.style.top = `${screenTop}px`;
            textarea.style.width = `${screenWidth}px`;
            textarea.style.height = `${screenHeight}px`;
            textarea.style.fontSize = `${activeEditTarget.size * scaleY}px`;
            textarea.style.color = activeEditTarget.color;
            textarea.style.lineHeight = '1.35';

            const isMono = Boolean(item.flags & 8) || /mono|courier|consolas/i.test(item.font);
            const isSerif = Boolean(item.flags & 4) || /times|roman|serif|termes|georgia|cmr|lmroman/i.test(item.font);

            textarea.style.fontWeight = activeEditTarget.is_bold ? '700' : '400';
            textarea.style.fontStyle = activeEditTarget.is_italic ? 'italic' : 'normal';
            if (isMono) {
                textarea.style.fontFamily = '"DejaVu Sans Mono", Consolas, "Courier New", monospace';
            } else if (isSerif) {
                textarea.style.fontFamily = '"Times New Roman", Times, Georgia, serif';
            } else {
                textarea.style.fontFamily = 'Helvetica, Arial, sans-serif';
            }

            // ENTER KEY COMMITS AND IMMEDIATELY SAVES TO PDF!
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (e.shiftKey) {
                        // Shift+Enter creates a newline inside textarea
                        return;
                    }
                    // Enter commits and saves immediately!
                    e.preventDefault();
                    commitActiveInput();
                } else if (e.key === 'Escape') {
                    closeActiveInput();
                }
            });

            interactiveOverlay.appendChild(textarea);
            textarea.focus();
            textarea.select();
            activeInput = textarea;

            updateToolbarStyleButtons();
            positionFloatingToolbar(textarea);
        }

        function openInlineEditorForNewText(newObj, clickX, clickY) {
            closeActiveInput();

            const scaleY = pdfPageImage.clientHeight / originalPageHeight;
            activeEditTarget = {
                ...newObj,
                is_bold: false,
                is_italic: false,
                is_paragraph: false,
                customSize: false
            };

            const textarea = document.createElement('textarea');
            textarea.className = 'active-inline-box';
            textarea.value = newObj.newText;
            textarea.style.left = `${clickX}px`;
            textarea.style.top = `${clickY}px`;
            textarea.style.width = `220px`;
            textarea.style.height = `60px`;
            textarea.style.fontSize = `${newObj.size * scaleY}px`;
            textarea.style.color = newObj.color;
            textarea.style.fontWeight = '400';
            textarea.style.fontStyle = 'normal';

            textarea.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    commitActiveInput();
                } else if (e.key === 'Escape') {
                    closeActiveInput();
                }
            });

            interactiveOverlay.appendChild(textarea);
            textarea.focus();
            textarea.select();
            activeInput = textarea;

            expandParagraphBtn.classList.add('hidden');
            expandParagraphBtn.classList.remove('flex');

            updateToolbarStyleButtons();
            positionFloatingToolbar(textarea);
        }

        expandParagraphBtn.addEventListener('click', () => {
            if (!activeEditTarget || !activeEditTarget.block || !activeInput) return;
            const block = activeEditTarget.block;
            activeEditTarget.is_paragraph = true;

            const scaleX = pdfPageImage.clientWidth / originalPageWidth;
            const scaleY = pdfPageImage.clientHeight / originalPageHeight;
            const [bx0, by0, bx1, by1] = block.bbox;

            activeInput.style.left = `${bx0 * scaleX}px`;
            activeInput.style.top = `${by0 * scaleY}px`;
            activeInput.style.width = `${Math.max((bx1 - bx0) * scaleX + 24, 340)}px`;
            activeInput.style.height = `${Math.max((by1 - by0) * scaleY + 24, 90)}px`;
            activeInput.value = block.text;
            activeInput.focus();

            expandParagraphBtn.classList.add('hidden');
            expandParagraphBtn.classList.remove('flex');
            positionFloatingToolbar(activeInput);
        });

        function updateToolbarStyleButtons() {
            if (!activeEditTarget) return;
            if (activeEditTarget.is_bold) {
                boldToggleBtn.className = 'px-2.5 py-0.5 rounded font-bold text-xs bg-blue-600 text-white shadow-sm transition';
            } else {
                boldToggleBtn.className = 'px-2.5 py-0.5 rounded font-bold text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
            }
            if (activeEditTarget.is_italic) {
                italicToggleBtn.className = 'px-2.5 py-0.5 rounded italic font-serif text-xs bg-blue-600 text-white shadow-sm transition';
            } else {
                italicToggleBtn.className = 'px-2.5 py-0.5 rounded italic font-serif text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
            }
        }

        function positionFloatingToolbar(inputEl) {
            floatingToolbar.classList.remove('hidden');
            const rect = inputEl.getBoundingClientRect();
            const wrapperRect = pageWrapper.getBoundingClientRect();

            let toolLeft = rect.left - wrapperRect.left;
            let toolTop = rect.top - wrapperRect.top - 46;

            if (toolTop < 0) toolTop = rect.bottom - wrapperRect.top + 8;

            floatingToolbar.style.left = `${toolLeft}px`;
            floatingToolbar.style.top = `${toolTop}px`;

            fontSizeDisplay.innerText = `${activeEditTarget.size.toFixed(1)}pt`;
            colorPicker.value = activeEditTarget.color.length === 7 ? activeEditTarget.color : '#000000';
            pageWrapper.appendChild(floatingToolbar);
        }

        function closeActiveInput() {
            if (activeInput) {
                activeInput.remove();
                activeInput = null;
            }
            floatingToolbar.classList.add('hidden');
            if (expandParagraphBtn) {
                expandParagraphBtn.classList.add('hidden');
                expandParagraphBtn.classList.remove('flex');
            }
            activeEditTarget = null;
        }

        // COMMIT & IMMEDIATELY RE-RENDER FROM SERVER
        async function commitActiveInput() {
            if (!activeInput || !activeEditTarget) return;

            const val = activeInput.value;
            if (val === '') {
                closeActiveInput();
                return;
            }

            // Guard: If editing existing text and nothing changed, abort silently
            const originalText = activeEditTarget.text || (activeEditTarget.block ? activeEditTarget.block.text : (activeEditTarget.span ? activeEditTarget.span.text : ''));
            if (!activeEditTarget.isNew && val.trim() === originalText.trim() && !activeEditTarget.customSize) {
                closeActiveInput();
                return;
            }

            // Guard: If clicking blank area and leaving placeholder unchanged, abort silently
            if (activeEditTarget.isNew && (val === 'New Text' || val.trim() === '')) {
                closeActiveInput();
                return;
            }

            liveStatusMsg.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Saving changes to PDF...';
            lucide.createIcons();

            let editPayload = null;

            if (activeEditTarget.isNew) {
                editPayload = {
                    type: 'add',
                    page_index: currentPageIndex,
                    x: activeEditTarget.x,
                    y: activeEditTarget.y,
                    newText: val.trim(),
                    size: activeEditTarget.size,
                    color: activeEditTarget.color,
                    is_bold: Boolean(activeEditTarget.is_bold),
                    is_italic: Boolean(activeEditTarget.is_italic)
                };
            } else {
                const targetBbox = activeEditTarget.bbox || (activeEditTarget.block ? activeEditTarget.block.bbox : activeEditTarget.span.bbox);
                const targetOldText = originalText;
                const targetFont = activeEditTarget.font || (activeEditTarget.block ? activeEditTarget.block.font : activeEditTarget.span.font);
                const targetFlags = (activeEditTarget.flags !== undefined) ? activeEditTarget.flags : (activeEditTarget.block ? activeEditTarget.block.flags : 0);

                editPayload = {
                    type: 'replace',
                    page_index: currentPageIndex,
                    bbox: targetBbox,
                    origin: activeEditTarget.origin || null,
                    oldText: targetOldText,
                    newText: val.trim(),
                    size: activeEditTarget.size,
                    color: activeEditTarget.color,
                    font: targetFont,
                    flags: targetFlags,
                    is_bold: Boolean(activeEditTarget.is_bold),
                    is_italic: Boolean(activeEditTarget.is_italic),
                    is_paragraph: Boolean(activeEditTarget.is_paragraph) || val.includes('\n'),
                    custom_size: Boolean(activeEditTarget.customSize)
                };
            }

            try {
                const res = await fetch('/api/apply_edit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(editPayload)
                });
                const resData = await res.json();

                if (resData.status === 'success') {
                    // Update the image immediately! The user sees the change reflected live on the PDF!
                    renderPageData(resData.data);
                    liveStatusMsg.innerHTML = '<i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-600"></i> Edit Applied to PostScript Stream!';
                    lucide.createIcons();
                } else {
                    alert('Error applying edit: ' + resData.message);
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            } finally {
                closeActiveInput();
            }
        }

        // Toolbar controls
        sizeMinusBtn.addEventListener('click', () => {
            if (activeEditTarget) {
                activeEditTarget.size = Math.max(activeEditTarget.size - 0.5, 6);
                activeEditTarget.customSize = true;
                fontSizeDisplay.innerText = `${activeEditTarget.size.toFixed(1)}pt`;
                if (activeInput) {
                    activeInput.style.fontSize = `${activeEditTarget.size * (pdfPageImage.clientHeight / originalPageHeight)}px`;
                }
            }
        });

        sizePlusBtn.addEventListener('click', () => {
            if (activeEditTarget) {
                activeEditTarget.size = Math.min(activeEditTarget.size + 0.5, 72);
                activeEditTarget.customSize = true;
                fontSizeDisplay.innerText = `${activeEditTarget.size.toFixed(1)}pt`;
                if (activeInput) {
                    activeInput.style.fontSize = `${activeEditTarget.size * (pdfPageImage.clientHeight / originalPageHeight)}px`;
                }
            }
        });

        boldToggleBtn.addEventListener('click', () => {
            if (!activeEditTarget) return;
            activeEditTarget.is_bold = !activeEditTarget.is_bold;
            if (activeInput) {
                activeInput.style.fontWeight = activeEditTarget.is_bold ? '700' : '400';
            }
            updateToolbarStyleButtons();
        });

        italicToggleBtn.addEventListener('click', () => {
            if (!activeEditTarget) return;
            activeEditTarget.is_italic = !activeEditTarget.is_italic;
            if (activeInput) {
                activeInput.style.fontStyle = activeEditTarget.is_italic ? 'italic' : 'normal';
            }
            updateToolbarStyleButtons();
        });

        colorPicker.addEventListener('input', (e) => {
            if (activeEditTarget) {
                activeEditTarget.color = e.target.value;
                if (activeInput) {
                    activeInput.style.color = activeEditTarget.color;
                }
            }
        });

        saveEditBtn.addEventListener('click', () => {
            commitActiveInput();
        });

        deleteTextBtn.addEventListener('click', async () => {
            if (!activeEditTarget || activeEditTarget.isNew) {
                closeActiveInput();
                return;
            }

            const editPayload = {
                type: 'redact',
                page_index: currentPageIndex,
                bbox: activeEditTarget.span.bbox
            };

            liveStatusMsg.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Erasing...';
            lucide.createIcons();

            try {
                const res = await fetch('/api/apply_edit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(editPayload)
                });
                const resData = await res.json();
                if (resData.status === 'success') {
                    renderPageData(resData.data);
                    liveStatusMsg.innerHTML = '<i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-600"></i> Text Erased Cleanly!';
                    lucide.createIcons();
                }
            } catch (err) {
                alert('Erase failed: ' + err.message);
            } finally {
                closeActiveInput();
            }
        });

        // Pagination
        prevPageBtn.addEventListener('click', () => {
            if (currentPageIndex > 0) loadPage(currentPageIndex - 1);
        });
        nextPageBtn.addEventListener('click', () => {
            if (currentPageIndex < totalPages - 1) loadPage(currentPageIndex + 1);
        });

        // Zoom
        zoomInBtn.addEventListener('click', () => {
            zoomLevel = Math.min(zoomLevel + 0.15, 2.0);
            applyZoom();
        });
        zoomOutBtn.addEventListener('click', () => {
            zoomLevel = Math.max(zoomLevel - 0.15, 0.6);
            applyZoom();
        });

        function applyZoom() {
            pageWrapper.style.transform = `scale(${zoomLevel})`;
            zoomLabel.innerText = `${Math.round(zoomLevel * 100)}%`;
        }

        // Upload custom PDF
        pdfFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            liveStatusMsg.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Loading Custom PDF...';
            lucide.createIcons();

            const reader = new FileReader();
            reader.onload = async () => {
                const base64Data = reader.result;
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pdf_base64: base64Data })
                });
                const resData = await res.json();
                if (resData.status === 'success') {
                    renderPageData(resData.data);
                    liveStatusMsg.innerHTML = '<i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-600"></i> Custom PDF Loaded!';
                    lucide.createIcons();
                } else {
                    alert('Failed to load PDF: ' + resData.message);
                }
            };
            reader.readAsDataURL(file);
        });

        // Download Clean PDF
        downloadPdfBtn.addEventListener('click', async () => {
            downloadPdfBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Downloading...';
            lucide.createIcons();

            try {
                const res = await fetch('/api/export', { method: 'POST' });
                const data = await res.json();

                if (data.status === 'success') {
                    const byteChars = atob(data.pdf_base64);
                    const byteNumbers = new Array(byteChars.length);
                    for (let i = 0; i < byteChars.length; i++) {
                        byteNumbers[i] = byteChars.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: 'application/pdf' });

                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = data.filename || 'edited_clean.pdf';
                    link.click();
                } else {
                    alert('Export failed: ' + data.message);
                }
            } catch (err) {
                alert('Export error: ' + err.message);
            } finally {
                downloadPdfBtn.innerHTML = '<i data-lucide="download" class="w-4 h-4"></i> Download Clean PDF';
                lucide.createIcons();
            }
        });

        window.addEventListener('resize', () => {
            rebuildInteractiveOverlay();
        });

        loadPage(0);
    </script>
</body>
</html>
